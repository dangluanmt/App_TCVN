        <tr><td><strong>Chỉ tiêu đất Trạm y tế</strong></td><td>Diện tích đất trạm y tế cấp đơn vị ở / xã</td><td>Tối thiểu <strong>500 m² / trạm</strong></td></tr>
      </table>

      <h4>2. Mật độ xây dựng thuần tối đa (%) theo quy mô lô đất và tầng cao</h4>
      <ul>
        <li><strong>Nhà ở riêng lẻ (Nhà liên kế, nhà phố, biệt thự):</strong>
          <ul>
            <li>Lô đất ≤ 90 m²: Mật độ tối đa <strong>100%</strong>.</li>
            <li>Lô đất 100 m²: Mật độ tối đa <strong>80%</strong>.</li>
            <li>Lô đất 200 m²: Mật độ tối đa <strong>70%</strong>.</li>
            <li>Lô đất 300 m²: Mật độ tối đa <strong>60%</strong>.</li>
            <li>Lô đất 500 m²: Mật độ tối đa <strong>50%</strong>.</li>
            <li>Lô đất ≥ 1.000 m²: Mật độ tối đa <strong>40%</strong>.</li>
            <li><em>(Các diện tích trung gian được tính theo phương pháp nội suy).</em></li>
          </ul>
        </li>
        <li><strong>Nhà chung cư (theo chiều cao công trình và diện tích lô đất):</strong>
          <ul>
            <li>Công trình cao ≤ 16 m: Mật độ xây dựng tối đa từ <strong>60%</strong> (lô ≥ 10.000 m²) đến <strong>75%</strong> (lô ≤ 3.000 m²).</li>
            <li>Công trình cao từ 16 m – 46 m: Mật độ tối đa dao động từ <strong>40% – 60%</strong>.</li>
            <li>Công trình cao > 46 m (trên 15 tầng): Mật độ khối tháp tối đa không vượt quá <strong>35% – 40%</strong> (khối đế tối đa <strong>50% – 60%</strong>).</li>
          </ul>
        </li>
        <li><strong>Công trình công cộng, dịch vụ & Nhà xưởng công nghiệp:</strong>
          <ul>
            <li>Công trình giáo dục, y tế, văn hóa: Mật độ xây dựng thuần tối đa <strong>40%</strong>.</li>
            <li>Chợ, trung tâm thương mại: Mật độ tối đa từ <strong>40% – 60%</strong> tùy theo diện tích khu đất.</li>
            <li>Nhà máy, xí nghiệp công nghiệp: Mật độ xây dựng thuần tối đa <strong>60% – 70%</strong> (nếu nhà xưởng cao ≥ 5 tầng, mật độ tối đa <strong>≤ 60%</strong>).</li>
          </ul>
        </li>
      </ul>

      <h4>3. Quy định về khoảng lùi công trình (Setback)</h4>
      <p>Khoảng lùi tối thiểu phụ thuộc vào chiều cao công trình (<em>H</em>) và chiều rộng lộ giới đường tiếp giáp (<em>L</em>):</p>
      <ul>
        <li><strong>Lộ giới <em>L</em> &lt; 19 m:</strong>
          <ul>
            <li>Công trình <em>H</em> ≤ 19 m: Khoảng lùi <strong>0 m</strong> (được xây sát chỉ giới đường đỏ).</li>
            <li>Công trình <em>H</em> = 22 m: Khoảng lùi tối thiểu <strong>3 m</strong>.</li>
            <li>Công trình <em>H</em> = 25 m: Khoảng lùi tối thiểu <strong>4 m</strong>.</li>
            <li>Công trình <em>H</em> ≥ 28 m: Khoảng lùi tối thiểu <strong>6 m</strong>.</li>
          </ul>
        </li>
        <li><strong>Lộ giới 19 m ≤ <em>L</em> &lt; 22 m:</strong>
          <ul>
            <li>Công trình <em>H</em> ≤ 22 m: Khoảng lùi <strong>0 m</strong>.</li>
            <li>Công trình <em>H</em> = 25 m: Khoảng lùi tối thiểu <strong>3 m</strong>.</li>
            <li>Công trình <em>H</em> ≥ 28 m: Khoảng lùi tối thiểu <strong>6 m</strong>.</li>
          </ul>
        </li>
        <li><strong>Lộ giới <em>L</em> ≥ 22 m:</strong>
          <ul>
            <li>Công trình <em>H</em> ≤ 25 m: Khoảng lùi <strong>0 m</strong>.</li>
            <li>Công trình <em>H</em> ≥ 28 m: Khoảng lùi tối thiểu <strong>6 m</strong>.</li>
          </ul>
        </li>
      </ul>

      <h4>4. Khoảng cách tối thiểu giữa các khối nhà (Khoảng cách ly)</h4>
      <ul>
        <li><strong>Hai đầu hồi nhà:</strong> Khoảng cách tối thiểu giữa 2 đầu hồi không nhỏ hơn <strong>4,0 m</strong> (nếu một hoặc cả hai bên tường đầu hồi mở cửa sổ lấy sáng/thông gió, khoảng cách tối thiểu là <strong>6,0 m</strong>).</li>
        <li><strong>Hai mặt dài của công trình song song:</strong>
          <ul>
            <li>Giữa 2 khối nhà cao ≤ 46 m: Khoảng cách tối thiểu <strong>≥ 0,5 H</strong> và không nhỏ hơn <strong>12 m</strong>.</li>
            <li>Giữa 2 khối nhà cao > 46 m: Khoảng cách tối thiểu giữa 2 mặt dài không được nhỏ hơn <strong>25 m</strong>.</li>
          </ul>
        </li>
      </ul>

      <h4>5. Chỉ tiêu diện tích bãi đỗ xe và giao thông tĩnh</h4>
      <ul>
        <li><strong>Chỉ tiêu quy mô chỗ đỗ xe:</strong>
          <ul>
            <li>Nhà ở chung cư, thương mại: Tối thiểu <strong>1 chỗ đỗ ô tô cho 4 – 6 căn hộ</strong>; <strong>1 chỗ đỗ xe máy cho 1 căn hộ</strong>.</li>
            <li>Công trình dịch vụ, văn phòng, thương mại: Tối thiểu <strong>1 chỗ đỗ ô tô / 100 m²</strong> sàn sử dụng.</li>
            <li>Khách sạn từ 3 sao trở lên: Tối thiểu <strong>1 chỗ đỗ ô tô / 4 – 5 buồng ngủ</strong>.</li>
          </ul>
        </li>
        <li><strong>Định mức diện tích tính toán cho một chỗ đỗ xe (đã bao gồm đường lưu thông nội bộ):</strong>
          <ul>
            <li>Ô tô con: <strong>25 m² / chỗ</strong>.</li>
            <li>Xe mô tô, xe máy: <strong>2,5 m² – 3,0 m² / chỗ</strong>.</li>
            <li>Xe đạp: <strong>0,9 m² / chỗ</strong>.</li>
          </ul>
        </li>
      </ul>`

      <h4>2. Khoảng cách di chuyển thoát nạn tối đa</h4>

  function removeVietnameseTones(str) {
    return str.normalize('NFD')
              .replace(/[̀-ͯ]/g, '')
              .replace(/đ/g, 'd').replace(/Đ/g, 'D')
              .toLowerCase().trim();
  }

  const searchInput = document.getElementById('searchInput');
  const cardList = document.getElementById('cardList');
  const resultCount = document.getElementById('resultCount');

  function renderData(keyword = '') {
    const cleanKey = removeVietnameseTones(keyword);
    const filtered = tcvnDatabase.filter(item => {
      const fullText = `${item.code} ${item.title} ${item.category} ${item.keywords} ${item.summary}`;
      return removeVietnameseTones(fullText).includes(cleanKey);
    });

    resultCount.textContent = `Tìm thấy ${filtered.length} / ${tcvnDatabase.length} tiêu chuẩn phù hợp`;

    if (filtered.length === 0) {
      cardList.innerHTML = `<div style="text-align:center; padding:40px; color:#888;">Không tìm thấy tiêu chuẩn nào khớp với từ khóa "${keyword}"</div>`;
      return;
    }

    cardList.innerHTML = filtered.map(item => `
      <div class="card" onclick="openModal(${tcvnDatabase.indexOf(item)})">
        <div class="card-header">
          <span class="code">${item.code}</span>
          <span class="category">${item.category}</span>
        </div>
        <div class="title">${item.title}</div>
        <div class="summary">${item.summary}</div>
        <div class="hint">👉 Nhấp để mở thông số chi tiết & liên kết file PDF gốc</div>
      </div>
    `).join('');
  }

  function openModal(index) {
    const item = tcvnDatabase[index];
    document.getElementById('modalCode').textContent = item.code;
    document.getElementById('modalTitle').textContent = item.title;
    document.getElementById('modalBody').innerHTML = item.details;
    
    // Nạp link PDF
    const pdfBtn = document.getElementById('pdfLink');
    if (item.pdfUrl) {
      pdfBtn.href = item.pdfUrl;
      pdfBtn.style.display = 'inline-flex';
    } else {
      pdfBtn.style.display = 'none';
    }

    document.getElementById('detailModal').style.display = 'flex';
  }

  function closeModal(event) {
    if (event.target.id === 'detailModal') {
      document.getElementById('detailModal').style.display = 'none';
    }
  }

  function closeModalDirect() {
    document.getElementById('detailModal').style.display = 'none';
  }

  function quickSearch(tag) {
    searchInput.value = tag;
    renderData(tag);
  }

  searchInput.addEventListener('input', (e) => {
    renderData(e.target.value);
  });

  // Render danh sách ban đầu
  renderData();
