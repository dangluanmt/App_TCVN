  function removeVietnameseTones(str) {
    return str.normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .replace(/đ/g, 'd').replace(/Đ/g, 'D')
              .toLowerCase().trim();
  }

  const searchInput = document.getElementById('searchInput');
  const cardList = document.getElementById('cardList');
  const resultCount = document.getElementById('resultCount');

  function renderData(keyword = '') {
    const cleanKey = removeVietnameseTones(keyword);
    const filtered = tcvnDatabase.filter(item => {
      const fullText = `${item.code} ${item.title} ${item.category} ${item.keywords} ${item.summary}`;
      return removeVietnameseTones(fullText).includes(cleanKey);
    });

    resultCount.textContent = `Tìm thấy ${filtered.length} / ${tcvnDatabase.length} tiêu chuẩn phù hợp`;

    if (filtered.length === 0) {
      cardList.innerHTML = `<div style="text-align:center; padding:40px; color:#888;">Không tìm thấy tiêu chuẩn nào khớp với từ khóa "${keyword}"</div>`;
      return;
    }

    cardList.innerHTML = filtered.map(item => `
      <div class="card" onclick="openModal(${tcvnDatabase.indexOf(item)})">
        <div class="card-header">
          <span class="code">${item.code}</span>
          <span class="category">${item.category}</span>
        </div>
        <div class="title">${item.title}</div>
        <div class="summary">${item.summary}</div>
        <div class="hint">👉 Nhấp để mở thông số chi tiết & liên kết file PDF gốc</div>
      </div>
    `).join('');
  }

  function openModal(index) {
    const item = tcvnDatabase[index];
    document.getElementById('modalCode').textContent = item.code;
    document.getElementById('modalTitle').textContent = item.title;
    document.getElementById('modalBody').innerHTML = item.details;
    
    // Nạp link PDF
    const pdfBtn = document.getElementById('pdfLink');
    if (item.pdfUrl) {
      pdfBtn.href = item.pdfUrl;
      pdfBtn.style.display = 'inline-flex';
    } else {
      pdfBtn.style.display = 'none';
    }

    document.getElementById('detailModal').style.display = 'flex';
  }

  function closeModal(event) {
    if (event.target.id === 'detailModal') {
      document.getElementById('detailModal').style.display = 'none';
    }
  }

  function closeModalDirect() {
    document.getElementById('detailModal').style.display = 'none';
  }

  function quickSearch(tag) {
    searchInput.value = tag;
    renderData(tag);
  }

  searchInput.addEventListener('input', (e) => {
    renderData(e.target.value);
  });

  // Render danh sách ban đầu
  renderData();

  // Đăng ký Service Worker để kích hoạt chế độ Offline
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('Service Worker đã sẵn sàng!', reg))
        .catch((err) => console.error('Lỗi Service Worker:', err));
    });
  }
</script>
